<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cagville - Coming Soon</title>
    <meta name="description" content="Something great is on the way.">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at 50% 0%, #1e293b, #0f172a 60%);
            color: #f8fafc;
            font-family: sans-serif;
        }

        /* ---------- Top bar ---------- */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 24px;
            background: #000;
            border-bottom: 1px solid #1e293b;
        }

        .brand {
            color: #f8fafc;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-decoration: none;
            white-space: nowrap;
        }

        .nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 4px;
        }

        .nav a {
            color: #94a3b8;
            font-size: 0.9rem;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 6px;
        }

        .nav a:hover,
        .nav a:focus-visible {
            color: #f8fafc;
            background: #1e293b;
        }

        /* ---------- Main content ---------- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 3rem);
            margin: 0 0 10px;
        }

        p {
            color: #94a3b8;
            font-size: 1.2rem;
            margin: 0;
        }

        @media (max-width: 600px) {
            .topbar { flex-direction: column; align-items: flex-start; }
            .nav { justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <!-- Home button: goes back to the landing page -->
        <a class="brand" href="/">CAGVILLE</a>

        <!-- Placeholder links: swap href and text once subpages exist -->
        <nav class="nav">
            <a href="#">PLACEHOLDER1</a>
            <a href="#">PLACEHOLDER2</a>
            <a href="#">PLACEHOLDER3</a>
            <a href="#">PLACEHOLDER4</a>
            <a href="#">PLACEHOLDER5</a>
        </nav>
    </header>

    <main>
        <h1>Cagville</h1>
        <p>Something great is on the way. Check back soon.</p>
    </main>
</body>
</html>
